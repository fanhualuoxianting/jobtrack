server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:jobtrack}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:?DB_USERNAME is required}
    password: ${DB_PASSWORD:?DB_PASSWORD is required}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      timeout: ${REDIS_TIMEOUT:3000ms}
  flyway:
    locations: classpath:db/migration

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

jobtrack:
  frontend-origin: ${JOBTRACK_FRONTEND_ORIGIN:?JOBTRACK_FRONTEND_ORIGIN is required}
  file-root: ${FILE_STORAGE_ROOT:/app/data/uploads}
  jwt:
    secret: ${JWT_SECRET:?JWT_SECRET is required and must be at least 32 bytes}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:30}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  auth:
    cookie-secure: ${JOBTRACK_COOKIE_SECURE:true}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.fanhua.jobtrack: ${JOBTRACK_LOG_LEVEL:INFO}

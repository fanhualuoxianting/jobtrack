# 开发环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:${MYSQL_PORT:3307}/${MYSQL_DATABASE:jobtrack}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:jobtrack}
    password: ${MYSQL_PASSWORD:change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  data:
    redis:
      host: localhost
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  # 开发环境加载演示数据迁移（V2）
  flyway:
    locations: classpath:db/migration,classpath:db/demo

jobtrack:
  jwt:
    # 仅本地开发的兜底密钥，禁止用于生产；生产必须提供 JWT_SECRET 环境变量
    secret: ${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-prod-0123456789abcdef}

logging:
  level:
    com.fanhua.jobtrack: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO

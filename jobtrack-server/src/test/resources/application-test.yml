# 测试环境配置
# 数据源与 Redis 地址由 Testcontainers 动态注入（见 AbstractIntegrationTest），
# SQL 通过 Flyway 迁移，保证测试与开发环境迁移脚本一致。
spring:
  flyway:
    enabled: true
    locations: classpath:db/migration

jobtrack:
  jwt:
    # 测试专用密钥，仅用于自动化测试
    secret: test-only-secret-for-integration-tests-0123456789
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  auth:
    # 测试中锁定阈值调低，便于快速触发锁定场景
    login-fail-max: 3
    login-fail-window-minutes: 10
    login-lock-minutes: 15

logging:
  level:
    com.fanhua.jobtrack: INFO
